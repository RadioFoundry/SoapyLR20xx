[package]
name = "lr20xx-sys"
description = "Raw bindings to liblr20xx, the C core of SoapyLR20xx (built from source with cc)"
version.workspace = true
edition.workspace = true
# The C it builds includes code under Semtech's Clear BSD license (LICENSES/).
license = "MIT AND BSD-3-Clause-Clear"
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "lr20xx"
build = "build.rs"
include = [
    "build.rs", "src/", "LICENSE", "LICENSES/",
    "lib/include/", "lib/src/", "lib/port/posix.c", "lib/hal/linux.c",
    "proto/include/", "proto/src/",
]

[build-dependencies]
cc = "1"
